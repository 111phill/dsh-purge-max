name: Community checks
on:
  push:
    branches: [master, native-panel]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/purge-panel/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm --prefix packages/purge-panel ci --ignore-scripts --legacy-peer-deps
      - run: npm run check:docs
      - run: node scripts/update-contributors.mjs --check
      - run: npm test
      - run: npm run check:client
      - run: npm pack --ignore-scripts && node scripts/smoke.mjs
      - run: npm run test:ui
      - run: npm --prefix packages/purge-panel run format:check
      - run: npm --prefix packages/purge-panel test
      - run: node --check lib/index.js && node --check lib/core.js && node --check lib/reapply.js && node --input-type=module -e "import './lib/index.js'"
      - run: npm pack --ignore-scripts

  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Full test suite
        if: runner.os != 'Windows'
        run: npm test
      - name: Full Windows suite with bounded process concurrency
        if: runner.os == 'Windows'
        run: npm test -- --test-concurrency=2
      - name: Windows PowerShell 5.1 installer wrapper
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/install-windows.ps1
      - name: PowerShell 7 installer wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/install-windows.ps1
      - name: Real Windows Electron handoff lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'purge-electron'
          npm install --prefix $runtime --no-package-lock --no-audit --no-fund electron@44.7.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $runtime 'node_modules/electron/install.js')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PURGE_ELECTRON_EXEC = Join-Path $runtime 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path -LiteralPath $env:PURGE_ELECTRON_EXEC)) { throw 'Electron binary was not installed' }
          node --test test/windows-electron-handoff.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $downloadLog = Join-Path $env:RUNNER_TEMP 'purge-download.log'
          $downloadError = Join-Path $env:RUNNER_TEMP 'purge-download-error.log'
          $p = Start-Process -FilePath $env:PURGE_ELECTRON_EXEC -ArgumentList 'scripts/check-bootstrap-download-runtime.mjs' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $downloadLog -RedirectStandardError $downloadError
          Get-Content $downloadLog,$downloadError
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Real macOS Electron diagnostics and manual-quit handoff
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/purge-electron"
          npm install --prefix "$runtime" --no-package-lock --no-audit --no-fund electron@44.7.0
          node "$runtime/node_modules/electron/install.js"
          export PURGE_ELECTRON_EXEC="$runtime/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          npm run test:electron
          ELECTRON_RUN_AS_NODE=1 "$PURGE_ELECTRON_EXEC" scripts/check-bootstrap-download-runtime.mjs
      - name: Real Linux root and service-user audit ownership
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/check-audit-ownership.mjs
      - name: Verify packed artifact on each platform
        run: npm pack --ignore-scripts && node scripts/smoke.mjs

  linux-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Actual Linux npm host installation and rollback
        shell: bash
        run: |
          set -euo pipefail
          export PURGE_TEST_LINUX_ROOT="$RUNNER_TEMP/purge-linux-official"
          mkdir -p "$PURGE_TEST_LINUX_ROOT"
          touch "$PURGE_TEST_LINUX_ROOT/.purge-test-only"
          npm install --global --prefix "$PURGE_TEST_LINUX_ROOT" --no-package-lock --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 pnpm@10.32.1
          export PATH="$PURGE_TEST_LINUX_ROOT/bin:$PATH"
          npm pack --ignore-scripts
          node scripts/check-linux-install-runtime.mjs "dsh-purge-community-$(node -p 'require("./package.json").version').tgz"

  npm-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Actual official host upgrade, rollback and failed rollback recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PURGE_TEST_NPM_ROOT="$RUNNER_TEMP/purge-npm-official"
          mkdir -p "$PURGE_TEST_NPM_ROOT"
          touch "$PURGE_TEST_NPM_ROOT/.purge-test-only"
          npm install --prefix "$PURGE_TEST_NPM_ROOT" --no-package-lock --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 pnpm@10.32.1
          export PATH="$PURGE_TEST_NPM_ROOT/node_modules/.bin:$PATH"
          gh release download v1.6.36 --repo kingcharleslzy-ai/dsh-purge --pattern dsh-purge-community-1.6.36.tgz --dir "$RUNNER_TEMP/purge-baseline"
          npm pack --ignore-scripts
          node scripts/check-npm-install-runtime.mjs "$RUNNER_TEMP/purge-baseline/dsh-purge-community-1.6.36.tgz" "dsh-purge-community-$(node -p 'require("./package.json").version').tgz"
